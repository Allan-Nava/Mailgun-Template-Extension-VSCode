# Clean install of dependencies, then lint + type-check/compile the extension.
# See: https://docs.github.com/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI Pipeline

# trigger build when pushing, or when creating a pull request
on: [push, pull_request]

jobs:
  build:
    # run build on latest ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # clean install from the lockfile
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # type-check + emit (uses the local tsc from node_modules, not a global one)
      - name: Compile
        run: npm run compile
